# ── Docker (local dev) ────────────────────────────────────────────────────────
# Activated by SPRING_PROFILES_ACTIVE=docker in docker-compose.yml
# Full observability stack available: Jaeger, Prometheus, Loki, Grafana

# Send traces to the local Jaeger container
management.opentelemetry.tracing.export.otlp.endpoint=http://jaeger:4318/v1/traces
management.opentelemetry.metrics.export.otlp.enabled=false

# Verbose SQL for easier local debugging
logging.level.slit.slitserver=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
