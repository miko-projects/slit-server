# ── Shared base — active in every environment ─────────────────────────────────

# Database (overridden per profile via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/slit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:slit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:slit}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway owns the schema; Hibernate should only map, not touch DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:change-this-to-a-random-256-bit-secret-before-deploying}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator — only expose health (used by Docker healthcheck)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Application name (shown in logs and traces)
spring.application.name=${SPRING_APPLICATION_NAME:slit-app}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.info.title=Slit API
springdoc.info.description=Receipt scanning, expense splitting, group management
springdoc.info.version=1.0.0

# Server
server.port=8080
