# Activated by SPRING_PROFILES_ACTIVE=prod

# Hide internal details from health endpoint on prod
management.endpoint.health.show-details=never

# Hide Swagger on prod — no reason to expose API docs publicly
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Quieter logs — only WARN for frameworks, INFO for app code
logging.level.root=WARN
logging.level.slit.slitserver=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Trust forwarded headers from proxy/load balancer
server.forward-headers-strategy=framework
