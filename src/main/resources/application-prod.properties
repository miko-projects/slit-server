# ── Production (Cloud Run + Railway PostgreSQL) ───────────────────────────────
# Activated by SPRING_PROFILES_ACTIVE=prod in Cloud Run environment variables
# No Jaeger / Prometheus / Loki — Cloud Run provides native structured logging
# and basic metrics. Add Cloud Trace / Cloud Monitoring if needed later.

# No OTLP export — disable tracing exporter entirely
management.tracing.sampling.probability=0.0

# Expose only health in prod — Prometheus scraping is not set up
management.endpoints.web.exposure.include=health
management.prometheus.metrics.export.enabled=false

# Hide internal details from health endpoint on prod
management.endpoint.health.show-details=never

# Hide Swagger on prod — no reason to expose API docs publicly
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Quieter logs — only WARN for frameworks, INFO for app code
logging.level.root=WARN
logging.level.slit.slitserver=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Cloud Run can be behind a proxy — trust forwarded headers
server.forward-headers-strategy=framework
