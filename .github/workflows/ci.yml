name: CI / CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── Build & test ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB:       slit
          POSTGRES_USER:     slit
          POSTGRES_PASSWORD: slit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slit -d slit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE:     prod
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/slit
          SPRING_DATASOURCE_USERNAME: slit
          SPRING_DATASOURCE_PASSWORD: slit
          JWT_SECRET:                 ci-test-secret-at-least-32-characters-long
        run: ./mvnw test

  # ── Deploy to VM ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on push to main — not on pull requests
    if: github.event_name == 'push'

    steps:

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/slit-server
            git pull
            docker compose build
            docker compose up -d
            echo "Deploy complete"
