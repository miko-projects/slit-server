name: CI / CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── Build & test ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB:       slit
          POSTGRES_USER:     slit
          POSTGRES_PASSWORD: slit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slit -d slit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE:     prod
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/slit
          SPRING_DATASOURCE_USERNAME: slit
          SPRING_DATASOURCE_PASSWORD: slit
          JWT_SECRET:                 ci-test-secret-at-least-32-characters-long
        run: ./mvnw test

  # ── Build & push Docker image ────────────────────────────────────────────────
  push-image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  # ── Deploy to VM ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: push-image

    steps:

      - name: Pull image and restart on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          command_timeout: 5m
          script: |
            # Write all secrets to .env (recreate on every deploy)
            cat > ~/slit-server/.env << 'EOF'
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EXCHANGE_API_KEY=${{ secrets.EXCHANGE_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            EOF

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest

            cd ~/slit-server
            docker compose up -d --remove-orphans

            docker image prune -f

            echo "Deploy complete"